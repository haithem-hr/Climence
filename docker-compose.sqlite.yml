services:
  proxy:
    build:
      context: ./infra/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      API_PORT: 3002
      CLIMENCE_AUTH_BYPASS: "0"
      JWT_SECRET: "change-me-in-production"
      CLIMENCE_STORAGE: "sqlite"
      CLIMENCE_DB_PATH: /data/telemetry.db
      CLIMENCE_BACKUP_ENABLED: "0"
      CLIMENCE_LOG_LEVEL: info
    ports:
      - "1883:1883"
    volumes:
      - ./data:/data
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      MQTT_BROKER_URL: mqtt://api:1883
      MQTT_USERNAME: drone
      MQTT_PASSWORD: flight123
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_CLIMENCE_API_URL: https://localhost
    depends_on:
      api:
        condition: service_healthy
