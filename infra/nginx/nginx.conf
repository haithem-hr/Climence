events {}

http {
  # Simple upstreams
  upstream climence_api {
    server api:3002;
  }

  upstream climence_dashboard {
    server dashboard:5173;
  }

  # Redirect HTTP -> HTTPS
  server {
    listen 80;
    server_name _;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS reverse proxy
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/climence.crt;
    ssl_certificate_key /etc/nginx/certs/climence.key;

    # Reasonable TLS settings for a demo (self-signed cert)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Dashboard (root)
    location / {
      proxy_pass http://climence_dashboard;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API under /api
    location /api/ {
      proxy_pass http://climence_api/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket under /ws/telemetry
    location /ws/telemetry {
      proxy_pass http://climence_api/ws/telemetry;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 1h;
    }
  }
}
