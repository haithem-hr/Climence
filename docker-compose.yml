services:
  proxy:
    build:
      context: ./infra/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      API_PORT: 3002
      CLIMENCE_AUTH_BYPASS: "0"
      JWT_SECRET: "change-me-in-production"
      CLIMENCE_STORAGE: "redis-postgres"
      CLIMENCE_DB_PATH: /data/telemetry.db
      DATABASE_URL: "postgres://climence:climence@postgres:5432/climence"
      REDIS_URL: "redis://redis:6379"
      CLIMENCE_BACKUP_ENABLED: "1"
      CLIMENCE_BACKUP_INTERVAL_MINUTES: "60"
      CLIMENCE_BACKUP_DIR: /data/backups
      CLIMENCE_LOG_LEVEL: info
    ports:
      - "1883:1883"
      - "3002:3002"
    volumes:
      - ./data:/data
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      MQTT_BROKER_URL: mqtt://api:1883
      MQTT_USERNAME: drone
      MQTT_PASSWORD: flight123
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_CLIMENCE_API_URL: https://localhost
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: climence
      POSTGRES_USER: climence
      POSTGRES_PASSWORD: climence
    ports:
      - "5432:5432"
      
    volumes:
      - climence_pg:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U climence -d climence" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - climence_redis:/data

volumes:
  climence_pg:
  climence_redis:
